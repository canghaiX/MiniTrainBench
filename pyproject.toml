[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minitrainbench"
version = "0.1.0"
description = "A compact benchmark for distributed GPT-like training with PyTorch DDP and FSDP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
  "ruff>=0.5,<1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[project.scripts]
minitrainbench = "minitrainbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
