[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minitrainbench"
version = "0.2.0"
description = "用于 PyTorch DDP/FSDP 的小型分布式 GPT-like 训练 benchmark。"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
  "ruff>=0.5,<1",
]
deepspeed = [
  "deepspeed==0.19.4",
]
rl = [
  "transformers>=4.57,<5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[project.scripts]
minitrainbench = "minitrainbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
