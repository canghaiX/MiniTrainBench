name: CPU 冒烟测试

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装 CPU 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt
          python -m pip install -e .
      - name: 代码静态检查
        run: ruff check .
      - name: 运行 CPU/Gloo 冒烟测试
        run: python -m pytest
